<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Página peliculas</title>
</head>
<body>
<h1>Películas</h1>

<table>
    <tr>
        <th>Título</th>
        <th>Año</th>
        <th>Duración</th>
        <th>Copias</th>
    </tr>

    <tr th:each=" p : ${peliculas}">
        <td th:text ="${p.titulo}"></td>
        <td th:text ="${p.anio}"></td>
        <td th:text ="${p.duracion}"></td>
        <td th:text ="${p.copias}"></td>
    </tr>
</table>

    <p><a th:href="@{/}">Volver a la portada</a></p>
    <p th:text= "| Esta página se ha visto ${visitasGlobales} veces|"> </p>
    <p th:text= "|Tu has visto esta página ${visitasIndividuales} veces|"> </p>

</body>
</html>
